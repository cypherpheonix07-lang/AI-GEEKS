<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="100%" height="24" fill="none" role="presentation">
  <defs>
    <linearGradient id="dividerPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000521" />
      <stop offset="25%" stop-color="#011F65" />
      <stop offset="50%" stop-color="#00D4FF">
        <animate attributeName="offset" values="0.2;0.8;0.2" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#2078CF" />
      <stop offset="100%" stop-color="#020024" />
    </linearGradient>
  </defs>
  <line x1="0" y1="12" x2="1200" y2="12" stroke="url(#dividerPulse)" stroke-width="2" />
  <circle cx="600" cy="12" r="4" fill="#00D4FF">
    <animate attributeName="cx" values="240;960;240" dur="5s" repeatCount="indefinite" />
  </circle>
</svg>
