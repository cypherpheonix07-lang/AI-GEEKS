name: AI GEEKS Platform CI & Architecture Verification

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  verify-and-build:
    name: Verify Clone, README, Types & Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Run 32-Check Clone Architecture Verification
        run: node scripts/verify-clone.mjs

      - name: Run Animated SVG & Mermaid README Verification
        run: node scripts/verify-readme.mjs

      - name: Run TypeScript Strict Typecheck
        run: npx tsc --noEmit

      - name: Build Production Next.js Bundle
        run: npm run build
